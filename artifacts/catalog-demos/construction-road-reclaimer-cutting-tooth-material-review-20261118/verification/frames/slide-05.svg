<text x="54" y="49" font-family="DejaVu Sans" font-size="17" font-weight="700" letter-spacing="1.2" fill="#287e79">REVIEW LIMITS</text>
<text x="54" y="91" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#1f3548">Recorded separately from this color fix</text>
<path d="M54 112 H1226" stroke="#b7c7d1" stroke-width="2"/>
<text x="54" y="692" font-family="DejaVu Sans" font-size="16" fill="#496273">Local software preview and source regression · no deployment or hardware acceptance</text>
<rect x="52" y="146" width="1176" height="484" rx="13" fill="white" stroke="#c8d5dd" stroke-width="2"/>
<text x="92" y="214" font-family="DejaVu Sans" font-size="24" fill="#1f3548">The five-preview ledger records weak scale or silhouette details, including the</text>
<text x="92" y="247" font-family="DejaVu Sans" font-size="24" fill="#1f3548">road-reclaimer envelope.</text>
<text x="92" y="316" font-family="DejaVu Sans" font-size="24" fill="#1f3548">The focused images show a source color mapping and software-rendered geometry;</text>
<text x="92" y="349" font-family="DejaVu Sans" font-size="24" fill="#1f3548">they are not a machine simulation.</text>
<text x="92" y="418" font-family="DejaVu Sans" font-size="24" fill="#1f3548">The branch is not deployed. No equipment rating, manufacturing suitability or</text>
<text x="92" y="451" font-family="DejaVu Sans" font-size="24" fill="#1f3548">hardware acceptance is claimed.</text>
