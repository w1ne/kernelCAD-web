# site/wrangler.toml — Phase 2B Task 6
#
# Cloudflare Pages config for kernelcad.com.
# CF Pages serves the Vite-built Studio bundle from ../dist (the repo root's
# dist/ output). The marketing-only site/ dir is no longer the build output.
#
# D1 binding kept for backward-compat: Pages Functions at site/functions/
# still handle the subscriber-capture endpoint.

name = "kernelcad-marketing"
compatibility_date = "2026-04-01"
pages_build_output_dir = "../dist"

[[d1_databases]]
binding = "DB"
database_name = "kernelcad-subscribers"
database_id = "8c284024-f44d-4a80-ac87-9212029725ac"
