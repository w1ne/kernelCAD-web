<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900"><rect width="100%" height="100%" fill="#111827"/><text x="44" y="75" font-size="28" fill="#78dce8">kernelCAD MCP · apply_surface_blend</text><text x="44" y="111" font-size="20" fill="#e5edf5">Local source-checkout invocation · G2 edge fillet</text><text x="44" y="147" font-size="20" fill="#e5edf5"></text><text x="44" y="183" font-size="20" fill="#e5edf5">INPUT</text><text x="44" y="219" font-size="20" fill="#e5edf5">shape_binding: body</text><text x="44" y="255" font-size="20" fill="#e5edf5">radius: 2 mm</text><text x="44" y="291" font-size="20" fill="#e5edf5">selector: { face: "top" }</text><text x="44" y="327" font-size="20" fill="#e5edf5">continuity: G2</text><text x="44" y="363" font-size="20" fill="#e5edf5"></text><text x="44" y="399" font-size="20" fill="#e5edf5">AUTHORED SOURCE</text><text x="44" y="435" font-size="20" fill="#e5edf5">const body = box(20, 20, 20);</text><text x="44" y="471" font-size="20" fill="#e5edf5">const _surface_blend = body.fillet(2, {"face":"top"}, { continuity: "G2" });</text><text x="44" y="507" font-size="20" fill="#e5edf5">return body;</text><text x="44" y="543" font-size="20" fill="#e5edf5"></text><text x="44" y="579" font-size="20" fill="#e5edf5">LOCAL EVALUATION</text><text x="44" y="615" font-size="20" fill="#e5edf5">ok: True</text><text x="44" y="651" font-size="20" fill="#e5edf5">BREP valid: True</text><text x="44" y="687" font-size="20" fill="#e5edf5"></text><text x="44" y="723" font-size="20" fill="#e5edf5">Existing Shape.fillet API · blend-surface NURBS poles not extracted</text><text x="44" y="759" font-size="20" fill="#e5edf5">Local evaluation evidence · not deployment or hardware acceptance</text></svg>