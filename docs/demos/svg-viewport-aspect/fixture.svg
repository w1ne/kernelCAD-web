<?xml version="1.0"?>
<!-- 200 x 100 mm viewport, square viewBox, default preserveAspectRatio.
     A correct importer letterboxes the square to 100 x 100 mm at x = 50..150. -->
<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="100mm" viewBox="0 0 100 100">
  <rect x="0" y="0" width="100" height="100" fill="none" stroke="#111" stroke-width="0.5"/>
  <circle cx="50" cy="50" r="25" fill="none" stroke="#c0392b" stroke-width="0.5"/>
</svg>
