<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#101827"/><text x="48" y="62" fill="#7de4cd" font-size="24" font-family="sans-serif">kernelCAD / ASSEMBLY PATH CHECK</text><text x="48" y="115" fill="white" font-size="34" font-family="sans-serif">Blind pocket: peg leaves only along +Z</text><text x="48" y="180" fill="#d9e1ef" font-size="21" font-family="monospace">verify({ check: 'assembly-path', code, disassemblyOrder: false })</text><text x="48" y="219" fill="#7de4cd" font-size="21" font-family="monospace">PEG removable: YES   |   valid directions: 0, 0, +1</text><text x="48" y="258" fill="#d9e1ef" font-size="21" font-family="monospace">[+1, 0, 0]   BLOCKED by housing   |   travel 4.000 mm</text><text x="48" y="297" fill="#d9e1ef" font-size="21" font-family="monospace">[-1, 0, 0]   BLOCKED by housing   |   travel 4.000 mm</text><text x="48" y="336" fill="#d9e1ef" font-size="21" font-family="monospace">[0, +1, 0]   BLOCKED by housing   |   travel 4.000 mm</text><text x="48" y="375" fill="#d9e1ef" font-size="21" font-family="monospace">[0, -1, 0]   BLOCKED by housing   |   travel 4.000 mm</text><text x="48" y="414" fill="#d9e1ef" font-size="21" font-family="monospace">[0, 0, +1]   CLEAR   |   travel 4.000 mm</text><text x="48" y="453" fill="#d9e1ef" font-size="21" font-family="monospace">[0, 0, -1]   BLOCKED by housing   |   travel 4.000 mm</text><text x="48" y="684" fill="#a8b5c9" font-size="19" font-family="sans-serif">Actual local checker output • continuous mesh validation • no deployment or hardware acceptance</text></svg>