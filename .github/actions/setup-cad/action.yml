# .github/actions/setup-cad/action.yml
#
# Minimal shared setup for kernelCAD CI jobs (lint / build-and-checks / test).
# Per-job extras (e.g., Playwright browsers in e2e) live in the calling job,
# not here — keep this composite tight.
#
# Steps:
#   1. Install ffmpeg (needed by gallery video tests: blackFrameCheck,
#      extractPoster, build-gallery).
#   2. setup-node (with built-in npm cache for ~/.npm).
#   3. Cache node_modules keyed on package-lock.json hash → skips npm ci on hit.
#   4. Cache .tsbuildinfo + node_modules/.cache + node_modules/.vite keyed on
#      TS source + vite/vitest config hashes → incremental TS compile + warm
#      vitest cache when source unchanged.
#   5. Conditional npm ci — only runs when node_modules cache missed.
name: Setup kernelCAD CI
description: Shared setup steps (node, caches, install) for parallel CI jobs.

runs:
  using: composite
  steps:
    - name: Install ffmpeg
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ffmpeg
        ffmpeg -version | head -1

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

    - name: Cache build artefacts (.tsbuildinfo + .cache + .vite)
      uses: actions/cache@v4
      with:
        path: |
          .tsbuildinfo
          node_modules/.cache
          node_modules/.vite
        key: ${{ runner.os }}-buildcache-${{ hashFiles('tsconfig*.json', 'src/**/*.ts', 'src/**/*.tsx', 'vite.config.ts', 'vitest.config.ts') }}
        restore-keys: |
          ${{ runner.os }}-buildcache-

    - name: Install dependencies (only if node_modules cache missed)
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
