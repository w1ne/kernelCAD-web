name: CI

# Push path-filters and the PR `changes` job (below) skip CI on truly content-only changes (top-level README/LICENSE/
# CHANGELOG, plus docs/ which is human-written prose). The reference-parts
# scorecard is an exception: its committed table is checked by a fast OCCT job.
# Anything that COULD
# affect runtime — src/, tests/, scripts/, eval/, site/, package*.json,
# tsconfig*.json, .github/workflows/ — still triggers CI. docs/guide/ and
# docs/demos/ are exceptions inside docs/: site:build consumes their blog
# sources, hero packet and videos, so changes there run CI like code.
on:
  push:
    branches:
      - master
    # `paths` with `!` patterns, not `paths-ignore`: only `paths` can take
    # the marketing inputs back in after excluding docs/**. The last match wins.
    paths:
      - '**'
      - '!README.md'
      - '!CONTRIBUTING.md'
      - '!CHANGELOG.md'
      - '!LICENSE'
      - '!RELEASE_NOTES.md'
      - '!docs/**'
      - 'docs/guide/**'
      - 'docs/demos/**'
      - 'docs/reference-parts-scorecard.md'
      - '!doc/**'
      - '!archive/**'
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:
  # Required so the branch-protection merge queue gets its checks: the queue
  # tests a speculative merge on a temporary `merge_group` ref and waits for the
  # same required checks (lint / build-and-checks / test) to report there.
  merge_group:

permissions:
  contents: read

concurrency:
  # Keyed per-PR (a new push cancels the prior run) but per-run for merge_group
  # so queued entries never cancel one another.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Three independent QC jobs run in parallel; e2e (master-only) gates on all
# three being green. See ci-acceleration-design (in kernelCAD-private).
jobs:
  # Docs-only PRs (every file matches the globs below) skip the heavy jobs.
  # This lives INSIDE ci.yml (not a path filter) so the required check names
  # always report: a skipped job reports success, and there is only ever one
  # run per name, so a code-touching PR can never be green-lit by a stand-in.
  # Keep the case-list in sync with the push `paths` filter above. Blog sources
  # and demo packets come first and count as build inputs, so content-only PRs
  # affecting the marketing build still run lint, build and the blog tests.
  # A scorecard-only docs PR runs only the reference-parts geometry/report gate.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      reference_parts: ${{ steps.detect.outputs.reference_parts }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          docs_only=false
          reference_parts=true
          if [ "$EVENT" = "pull_request" ]; then
            reference_parts=false
            files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR}/files" --jq '.[] | .filename, (.previous_filename // empty)')
            if [ -n "$files" ]; then
              docs_only=true
              while IFS= read -r f; do
                case "$f" in
                  docs/guide/*|docs/demos/*) echo "marketing input: $f"; docs_only=false ;;
                  docs/reference-parts-scorecard.md) reference_parts=true ;;
                  README.md|CONTRIBUTING.md|CHANGELOG.md|LICENSE|RELEASE_NOTES.md|docs/*|doc/*|archive/*) ;;
                  *) echo "non-docs file: $f"; docs_only=false; reference_parts=true ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "reference_parts=$reference_parts" >> "$GITHUB_OUTPUT"

  reference-parts:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.reference_parts == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cad
      - name: Reference-parts geometry and scorecard gate
        run: npm run test:reference-parts
  lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cad
      - name: QC — lint
        run: npm run qc:lint

  build-and-checks:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cad
      - name: QC — typecheck + build:cli + cookbook + drift check
        run: npm run qc:build

  # Slow modeled-thread geometry proofs (full M3–M12 helical sweep, modeled
  # tapped holes, bolt-in-nut clearance and interference on the M6 example).
  # Each modeled thread costs seconds of OCCT booleans, so these stay out of
  # the required sharded `test` gate and run here instead. Deliberately NOT a
  # required check and NOT in branch protection. The tests skip unless
  # KERNELCAD_SLOW_GEOMETRY_TESTS=1, which only this job sets.
  geometry-proofs:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cad
      - name: Modeled thread proofs
        env:
          KERNELCAD_SLOW_GEOMETRY_TESTS: '1'
          NODE_OPTIONS: '--max-old-space-size=3072'
        run: npx vitest run tests/integration/modeling/modeledThreadProofs.test.ts

  # Click-to-frame benchmark of an in-browser parameter edit (?kernel=browser):
  # value entered -> worker request -> response -> meshes installed -> next
  # rendered frame, on a production build in headless Chromium with a small
  # fixture. p50/p95 land in the job summary and the `param-edit-frame`
  # artifact. It fails only on errors or wrong geometry (and runs the browser
  # kernel lockdown probe), never on timings: runner speed and SwiftShader vary
  # too much for a wall-time gate. Deliberately NOT a required check.
  param-edit-benchmark:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cad
      # The headless shell only; apt (`--with-deps`, ~8 min) only when the
      # runner image cannot launch it as it is.
      - name: Install Playwright Chromium (headless shell)
        run: |
          npx playwright install --only-shell chromium
          node -e "require('@playwright/test').chromium.launch().then((b) => b.close())" \
            || npx playwright install-deps chromium
      - name: Production build
        env:
          VITE_BASE_PATH: /
        run: npx vite build
      - name: Click-to-frame benchmark (reported, not gated on time)
        run: npx playwright test -c playwright.perf.config.ts
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: param-edit-frame
          path: test-results/perf
          retention-days: 14

  # The vitest suite is sharded across parallel runners so the merge gate stays
  # responsive. Eight shards keep coverage unchanged while cutting duplicated
  # checkout/setup/build work compared with the previous 12-runner fanout.
  test-shard:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # Slow example-sweep tests were replaced by fast smoke tests, so each
    # shard now has a 10-minute budget.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cad
      # cli-bundle and eval/* integration tests require the bundled CLI at
      # dist/cli/index.js; we rebuild it in each shard's runner because jobs
      # run on separate runners with isolated FS. The shared build cache
      # keeps this fast (~10-15s on hit).
      - name: Build CLI bundle (required by integration tests)
        run: npm run build:cli
      - name: QC — vitest (shard ${{ matrix.shard }}/8)
        run: npm test -- --shard=${{ matrix.shard }}/8

  # Gate job: carries the required-check name `test` so branch protection is
  # unchanged. if: always() ensures it reports failure (rather than being
  # skipped) when a shard fails or is cancelled.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [changes, test-shard, reference-parts]
    if: always()
    steps:
      - name: All test shards green
        run: |
          [ "${{ needs.changes.result }}" = "success" ] || { echo "changes job: ${{ needs.changes.result }}"; exit 1; }
          if [ "${{ needs.changes.outputs.docs_only }}" = "true" ]; then
            [ "${{ needs.changes.outputs.reference_parts }}" = "true" ] || exit 0
          else
            [ "${{ needs.test-shard.result }}" = "success" ] || { echo "shard result: ${{ needs.test-shard.result }}"; exit 1; }
          fi
          if [ "${{ needs.changes.outputs.reference_parts }}" = "true" ]; then
            [ "${{ needs.reference-parts.result }}" = "success" ] || { echo "reference-parts result: ${{ needs.reference-parts.result }}"; exit 1; }
          fi

  # Exercises the FEA solve and USD-Isaac export against the REAL external
  # toolchain (CalculiX, gmsh, usd-core) instead of letting the integration
  # tests skip when the tools are absent. Deliberately NOT part of the
  # required `test` gate and NOT added to branch protection: apt/pip installs
  # here are slower and less reliable than the sandboxed unit suite, and a
  # flaky external-tool fetch must never block a merge. KERNELCAD_REQUIRE_
  # FEA_TOOLCHAIN=1 turns every "toolchain absent, skip" path in these tests
  # into a hard failure, so a broken install shows up as a failing job rather
  # than a quietly-green skip.
  external-tools:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cad

      - name: Install CalculiX (ccx) and gmsh wheel runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y calculix-ccx libglu1-mesa libgl1 libxcursor1 \
            libxinerama1 libxft2 libxrender1 libgomp1

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-gmsh4.15.2-usdcore

      - name: Install gmsh + usd-core into .tools-venv
        run: |
          python3 -m venv .tools-venv
          .tools-venv/bin/pip install --disable-pip-version-check gmsh==4.15.2 usd-core
          .tools-venv/bin/python -c "import gmsh, pxr; print('gmsh', gmsh.GMSH_API_VERSION); print('pxr ok')"

      - name: FEA integration tests (real toolchain, skip-is-failure)
        env:
          KERNELCAD_FEA_PYTHON: ${{ github.workspace }}/.tools-venv/bin/python
          KERNELCAD_REQUIRE_FEA_TOOLCHAIN: '1'
        run: |
          NODE_OPTIONS=--max-old-space-size=3072 npx vitest run \
            tests/unit/fea/feaGate.integration.test.ts \
            tests/unit/fea/cantilever.integration.test.ts \
            tests/unit/fea/stressInfill.integration.test.ts \
            tests/unit/fea/loadCapacityFea.integration.test.ts

      - name: USD-Isaac export validation (real pxr schemas, skip-is-failure)
        env:
          KERNELCAD_FEA_PYTHON: ${{ github.workspace }}/.tools-venv/bin/python
          KERNELCAD_REQUIRE_FEA_TOOLCHAIN: '1'
        run: |
          NODE_OPTIONS=--max-old-space-size=3072 npx vitest run \
            tests/integration/export/usdIsaacPxr.test.ts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, build-and-checks, test]
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' && github.base_ref == 'master') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cad
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests (Playwright)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 7
