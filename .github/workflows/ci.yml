name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Three independent QC jobs run in parallel; e2e (master-only) gates on all
# three being green. See ci-acceleration-design (in kernelCAD-private).
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cad
      - name: QC — lint
        run: npm run qc:lint

  build-and-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cad
      - name: QC — typecheck + build:cli + cookbook + drift check
        run: npm run qc:build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cad
      # cli-bundle and eval/* integration tests require the bundled CLI at
      # dist/cli/index.js; we rebuild it in the test job's runner because the
      # build-and-checks job runs on a separate runner with isolated FS.
      # The shared build cache keeps this fast (~10-15s on hit).
      - name: Build CLI bundle (required by integration tests)
        run: npm run build:cli
      - name: QC — vitest
        run: npm run qc:test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, build-and-checks, test]
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' && github.base_ref == 'master') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cad
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests (Playwright)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 7
