name: Parts Catalog

# Builds a self-hosted, license-clean parts catalog from the CC-BY FreeCAD
# parts_library and deploys it to Cloudflare Pages (project: kernelcad-parts).
# Point KERNELCAD_PARTS_BASE_URL at https://kernelcad-parts.pages.dev to use it
# as kernelCAD's remote source instead of a third-party API.

on:
  # Manual because this is a long ingest/deploy job and the catalog does not
  # need to refresh on every calendar week while Actions quota is tight.
  workflow_dispatch:
    inputs:
      subdir:
        description: 'FreeCAD-library subtree to ingest (e.g. "Mechanical Parts/Bearings" for a quick run)'
        type: string
        default: 'Mechanical Parts'

permissions:
  contents: read

concurrency:
  group: parts-catalog
  cancel-in-progress: true

jobs:
  ingest-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The electronics ingest compiles authored .kcad.ts part sources to STEP via
      # the kernelCAD CLI (dist/cli/index.js); build it first or those parts SKIP.
      - name: Build kernelCAD CLI
        run: npm run build:cli

      # ---- Incremental: the FreeCAD ingest is the expensive half (~25 min to
      # sparse-clone + mesh + measure ~2400 parts) and is DETERMINISTIC given
      # (upstream revision, subdir, ingest code). Cache it on exactly those three
      # inputs so a change that only touches electronics costs ~5 min, not ~30.
      #
      # The cache holds the MECHANICAL BASE ONLY (catalog-freecad/), never the
      # merged catalog. That is load-bearing: the electronics ingest merges into
      # whatever it finds, so caching a post-merge catalog would resurrect parts
      # that were deliberately REMOVED from the manifest (an unlicensed part
      # would silently reappear). Seeding a fresh catalog/ from the mechanical
      # base each run keeps electronics a clean rebuild from the manifest.
      - name: Resolve FreeCAD library revision
        id: fclib
        run: |
          SHA=$(git ls-remote https://github.com/FreeCAD/FreeCAD-library HEAD | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "FreeCAD-library HEAD: $SHA"

      - name: Restore mechanical catalog base
        id: mech-cache
        uses: actions/cache@v4
        with:
          path: catalog-freecad
          key: >-
            freecad-v1-${{ steps.fclib.outputs.sha }}-${{
            hashFiles('scripts/ingestFreecadLibrary.ts', 'scripts/ingestParts.ts') }}-${{
            hashFiles('.nvmrc') }}-${{ github.event.inputs.subdir || 'Mechanical Parts' }}

      - name: Ingest FreeCAD library (cache miss only)
        if: steps.mech-cache.outputs.cache-hit != 'true'
        run: >
          npx tsx scripts/ingestFreecadLibrary.ts
          --out catalog-freecad
          --subdir "${{ github.event.inputs.subdir || 'Mechanical Parts' }}"
          --base-url https://kernelcad-parts.pages.dev

      # Fail loudly rather than deploying a catalog that silently lost the
      # mechanical parts — Pages publishes the directory wholesale, so an empty
      # base here would take 2400 parts off the live site.
      - name: Seed catalog from mechanical base
        run: |
          if [ ! -d catalog-freecad/v1 ]; then
            echo "::error::catalog-freecad/v1 missing — mechanical base neither cached nor built."
            exit 1
          fi
          rm -rf catalog
          cp -R catalog-freecad catalog
          echo "seeded catalog/ from mechanical base (cache-hit=${{ steps.mech-cache.outputs.cache-hit }})"

      - name: Ingest electronics (chips, modules, IC packages)
        # Fetches the CC-licensed 3D models declared in scripts/electronics-parts.json
        # and MERGES them into the same catalog (never clobbers the mechanical parts).
        # These are the parts LabWired supports, so a design can carry real geometry.
        run: >
          npx tsx scripts/ingestElectronics.ts catalog
          --manifest scripts/electronics-parts.json
          --base-url https://kernelcad-parts.pages.dev

      # Required authored sources are a required part of this deploy: unlike
      # third-party upstream models, a failed A4988/SG90 export must never be
      # silently skipped and published as a catalog omission. This verifies the
      # five package artifacts plus the two motor-control components and their
      # hash-bound authored interfaces before any board conversion or deploy.
      - name: Verify required authored electronics catalog
        run: >
          npx tsx scripts/verifyAuthoredElectronicsCatalog.ts catalog
          --manifest scripts/electronics-parts.json

      - name: Build web-ready board GLBs (and drop oversized board STEPs)
        # For every authored dev-board (kcad_source id ending in -board), compile
        # a GLB, decimate it to a few hundred KB (uncompressed, colors preserved),
        # write catalog/glb/<id>.glb, add glbUrl + drop stepUrl on the record, and
        # delete the board's oversized catalog/step/<id>.step. This keeps every
        # deployed file under Cloudflare Pages' 25 MiB limit and serves the web a
        # browser-loadable mesh. Non-authored parts keep their STEP untouched.
        run: >
          npx tsx scripts/buildBoardGlbs.ts catalog
          --manifest scripts/electronics-parts.json
          --base-url https://kernelcad-parts.pages.dev

      - name: Summarize
        run: |
          COUNT=$(node -e "console.log(require('./catalog/v1/catalog/parts.index.json').catalog.partCount)")
          echo "Ingested **$COUNT** parts." >> "$GITHUB_STEP_SUMMARY"
          GLBS=$(ls catalog/glb/*.glb 2>/dev/null | wc -l | tr -d ' ')
          echo "Built **$GLBS** web-ready board GLB(s)." >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure Cloudflare Pages project exists
        run: npx wrangler@4.94.0 pages project create kernelcad-parts --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy catalog to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.94.0'
          command: pages deploy catalog --project-name=kernelcad-parts --branch=main --commit-dirty=true --skip-caching
