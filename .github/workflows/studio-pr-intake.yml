# Uses pull_request_target so fork PRs get a write token for the label/comment.
# SAFETY: this workflow must never check out or execute PR head code; it only
# reads the changed-file list via the API. Do not add actions/checkout here.
name: Studio PR intake
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const patterns = [/^src\/studio\//, /^src\/funnel\//, /^src\/ui\//, /^src\/server\//,
              /^tests\/funnel\//, /^tests\/unit\/server\//, /^tests\/integration\/studio\//,
              /^index\.html$/, /^vite\.config\.ts$/, /^playwright\.config\.ts$/];
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const files = await github.paginate(github.rest.pulls.listFiles,
              { owner, repo, pull_number: issue_number, per_page: 100 });
            const hits = files.map(f => f.filename).filter(f => patterns.some(r => r.test(f)));
            if (!hits.length) return;

            // Apply the label; create it on first use if it does not exist yet.
            // Any remaining permission/API error is logged, never thrown: this
            // workflow must not fail external PRs over a stray Studio hunk.
            const label = { name: 'studio-private', color: '5319e7', description: 'Touches proprietary Studio code' };
            try {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label.name] });
            } catch {
              try {
                await github.rest.issues.createLabel({ owner, repo, name: label.name, color: label.color, description: label.description });
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label.name] });
              } catch (retryError) {
                console.log(`[studio-pr-intake] could not apply ${label.name} label: ${retryError.message}`);
              }
            }

            // Post the guidance comment once; the marker dedupes synchronize runs.
            const marker = '<!-- studio-intake -->';
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number });
            if (comments.some(c => (c.body || '').includes(marker))) return;
            try {
              await github.rest.issues.createComment({ owner, repo, issue_number,
                body: `${marker}\nThis PR touches Studio app files, which are proprietary and no longer live in this repository.\n\n- If the change is core-only, move the Studio hunks out and we can review the rest.\n- If the change is Studio-only, please open an issue describing the problem and a maintainer will consider porting it privately with attribution.\n\nTouched: \n${hits.slice(0, 12).map(f => '- \`' + f + '\`').join('\n')}` });
            } catch (error) {
              console.log(`[studio-pr-intake] could not post intake comment: ${error.message}`);
            }
