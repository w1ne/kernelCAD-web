name: CI (docs-only companion)

# ci.yml path-ignores docs-only changes, so its required checks (lint,
# build-and-checks, test) never report and such PRs would stay BLOCKED. This
# workflow reports those same check names, but ONLY when every file in the PR
# matches the ignored globs below. KEEP `paths` AND the case-list in the
# `changes` job IN SYNC with the paths-ignore list in ci.yml.
#
# If a PR touches both docs and code, ci.yml runs too; the jobs here are then
# SKIPPED (never green-lit on its own), so the real ci.yml result decides.
on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'RELEASE_NOTES.md'
      - 'docs/**'
      - 'doc/**'
      - 'archive/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: docs-only-detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR}/files" --jq '.[] | .filename, (.previous_filename // empty)')
          docs_only=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              README.md|CONTRIBUTING.md|CHANGELOG.md|LICENSE|RELEASE_NOTES.md|docs/*|doc/*|archive/*) ;;
              *) echo "non-docs file: $f"; docs_only=false ;;
            esac
          done <<< "$files"
          [ -n "$files" ] || docs_only=false
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "docs-only change; ci.yml path-ignored"

  build-and-checks:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "docs-only change; ci.yml path-ignored"

  test:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "docs-only change; ci.yml path-ignored"
