name: Setup user tracking (one-time)

# One-time provisioning of:
#   1. Cloudflare D1 database `kernelcad-subscribers` + schema migration.
#   2. Cloudflare Web Analytics site for kernelcad.com (token returned).
#   3. In-place edit of site/wrangler.toml + site/index.html with the
#      provisioned IDs/tokens; commit + push back to the calling branch.
#
# Trigger: manual (workflow_dispatch) from the Actions tab.
# Idempotent: re-runs are safe; existing D1 / Web Analytics sites are
# detected and reused. Only commits when files actually change.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  D1_NAME: kernelcad-subscribers
  WEB_ANALYTICS_HOST: kernelcad.com

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Provision D1 database (idempotent)
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # List existing D1 databases; create if missing.
          existing=$(wrangler d1 list --json 2>/dev/null | jq -r ".[] | select(.name == \"$D1_NAME\") | .uuid")
          if [ -z "$existing" ]; then
            echo "Creating D1 database $D1_NAME..."
            wrangler d1 create "$D1_NAME" > /tmp/d1-create.txt
            db_id=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/d1-create.txt | head -1)
          else
            echo "D1 database $D1_NAME already exists ($existing); reusing."
            db_id="$existing"
          fi
          echo "database_id=$db_id" >> "$GITHUB_OUTPUT"

      - name: Apply schema migration (idempotent — uses CREATE IF NOT EXISTS)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler d1 execute "$D1_NAME" --remote --file=site/migrations/0001_subscribers.sql

      - name: Provision Web Analytics site (idempotent)
        id: wa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # List existing RUM sites; reuse if one already covers the host.
          existing=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/rum/site_info/list?per_page=100" \
            | jq -r ".result.[] | select(.host == \"$WEB_ANALYTICS_HOST\") | .site_token" \
            | head -1)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            echo "Web Analytics site for $WEB_ANALYTICS_HOST already exists; reusing token."
            site_token="$existing"
          else
            echo "Creating Web Analytics site for $WEB_ANALYTICS_HOST..."
            response=$(curl -sf -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/rum/site_info" \
              -d "{\"host\":\"$WEB_ANALYTICS_HOST\",\"auto_install\":false}")
            site_token=$(echo "$response" | jq -r '.result.site_token')
          fi
          echo "site_token=$site_token" >> "$GITHUB_OUTPUT"

      - name: Patch wrangler.toml + HTML with provisioned values
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
          WA_TOKEN: ${{ steps.wa.outputs.site_token }}
        run: |
          set -euo pipefail
          sed -i "s|REPLACE_WITH_D1_DATABASE_ID|$DB_ID|g" site/wrangler.toml
          sed -i "s|REPLACE_WITH_CF_WEB_ANALYTICS_TOKEN|$WA_TOKEN|g" site/index.html site/thanks.html

      - name: Commit changes back to the branch (if any)
        run: |
          set -euo pipefail
          git config user.email "14119286+w1ne@users.noreply.github.com"
          git config user.name "w1ne"
          if git diff --quiet site/wrangler.toml site/index.html site/thanks.html; then
            echo "No changes — placeholders already replaced. Skipping commit."
            exit 0
          fi
          git add site/wrangler.toml site/index.html site/thanks.html
          git commit -m "chore(user-tracking): provisioned D1 + Web Analytics tokens"
          git push origin "HEAD:${{ github.ref_name }}"
