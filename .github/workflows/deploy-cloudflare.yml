name: Deploy to Cloudflare Pages

# Phase 2B: deploys the Vite-built Studio bundle to kernelcad-marketing (kernelcad.com).
# The kernelcad-marketing CF Pages project previously hosted the static marketing site;
# it now receives the Vite Studio bundle so kernelcad.com becomes the live funnel.
#
# Project routing:
#   - kernelcad-marketing ← dist/ (kernelcad.com) — Studio funnel
#   - kernelcad-app       ← dist/ (app.kernelcad.com, Vite build with base=/)

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - feat/kernelcad-website
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: Deploy Studio bundle to kernelcad-marketing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite Studio bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages (kernelcad-marketing)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy ../dist --project-name=kernelcad-marketing --commit-dirty=true

  app:
    name: Deploy visual debugger app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app (root-rooted base path for app.kernelcad.com)
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: Deploy to Cloudflare Pages (kernelcad-app)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=kernelcad-app --branch=main --commit-dirty=true
