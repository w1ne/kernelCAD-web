name: Release PR Template Check

on:
  pull_request:
    branches:
      - 'release/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  release-template:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release checklist in PR body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request?.body || '';
            const required = [
              'Release Candidate Checklist',
              '- [ ] `qc` check is green',
              '- [ ] `e2e` check is green',
              '- [ ] `build` check is green',
            ];
            const missing = required.filter((token) => !body.includes(token));
            if (missing.length > 0) {
              core.setFailed(`Missing release checklist entries in PR body: ${missing.join(', ')}`);
            }
